name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit and non-GPU integration (${{ matrix.platform }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, windows-2022]
        python: ["3.12", "3.13", "3.14"]
    env:
      NAPARI_CONFIG: ""
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-local-path: ${{ runner.temp }}/uv-cache
          prune-cache: true
          cache-suffix: ${{ matrix.python }}
          cache-dependency-glob: uv.lock

      - name: Set up Qt and OpenGL display
        uses: pyvista/setup-headless-display-action@10e6efb97af3cd1523828f0e22c39f0e4567f3e4 # v5.2.0
        with:
          qt: true
          pyvista: false
          wm: herbstluftwm
          install-mesa3d-offscreen: false

      - name: Install plugin test dependencies
        run: |
          uv sync --locked --only-group dev --only-group test --python ${{ matrix.python }}
          uv pip install --no-deps --editable .

      - name: Lint and check formatting
        if: runner.os == 'Linux' && matrix.python == '3.14'
        run: |
          uv run --locked --no-sync ruff check src tests
          uv run --locked --no-sync ruff format --check src tests

      - name: Validate the napari manifest
        run: uv run --locked --no-sync python -m npe2 validate src/napari_localize_psf/napari.yaml

      # Native backend builds and validation belong upstream. Keep these jobs
      # independent of CUDA; GPU integration tests run locally with real hardware.
      - name: Run unit and non-GPU integration tests
        run: >-
          uv run --locked --no-sync pytest
          --ignore=tests/test_processing_gpu.py -m "not gpu"
          --strict-markers --tb=short
          --junitxml=junit.xml
          --cov=napari_localize_psf
          --cov-report=term-missing
          --cov-report=xml:coverage.xml

      - name: Build the package
        if: runner.os == 'Linux' && matrix.python == '3.14'
        run: uv build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: non-gpu-test-reports-${{ matrix.platform }}-py${{ matrix.python }}
          path: |
            junit.xml
            coverage.xml
          retention-days: 14
